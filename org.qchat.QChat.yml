app-id: org.qchat.QChat
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: qchat
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: qchat
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: .
